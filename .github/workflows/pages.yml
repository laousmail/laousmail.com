name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publish only what the site needs. Fan comments (fan-reactions/,
      # avatars/), comments-api/ and scripts/ stay in the repo but off the site.
      - name: Stage public files
        run: |
          mkdir _site
          cp -r index.html privacy.html site.css artist.js releases.js config.js \
            favicon.svg media play CNAME robots.txt sitemap.xml .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
